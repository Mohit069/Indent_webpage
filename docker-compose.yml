# Everything the app needs on one server: Postgres and the app itself.
#
#   cp .env.example .env      # then edit it
#   docker compose up -d
#   docker compose exec app node -e "require('child_process').execSync('npm run db:push && npm run db:seed',{stdio:'inherit'})"
#
# The database lives in a named volume, so `docker compose down` does not
# destroy it. Use `down -v` only when you genuinely mean to erase everything.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: indent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: indent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U indent -d indent']
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host — only the app container reaches it.
    expose:
      - '5432'

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://indent:${POSTGRES_PASSWORD}@db:5432/indent
      INDENT_PREFIX: ${INDENT_PREFIX:-MQ/IND}
    # There is no authentication in this app. Binding to 127.0.0.1 keeps it off
    # every other interface — put a reverse proxy or VPN in front to reach it
    # from elsewhere on the LAN, and never give it a public hostname.
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  pgdata:
